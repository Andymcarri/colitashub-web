<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#070707">
  <title>Página no encontrada | ColitasHub</title>
  <style>
    :root{
      --black:#070707;
      --ivory:#f4ecd9;
      --red:#e03a4e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--black);
      color:var(--ivory);
      font-family:Arial,sans-serif;
      text-align:center;
    }
    main{max-width:620px}
    .code{
      color:var(--red);
      font-size:12px;
      font-weight:700;
      letter-spacing:.2em;
    }
    h1{
      margin:10px 0 8px;
      font-family:Georgia,serif;
      font-size:clamp(42px,8vw,78px);
      font-weight:400;
    }
    p{
      margin:0 auto 24px;
      max-width:500px;
      color:#d7ccb4;
      line-height:1.6;
    }
    a{
      display:inline-block;
      padding:12px 18px;
      border:1px solid var(--red);
      border-radius:6px;
      color:var(--ivory);
      text-decoration:none;
      font-size:13px;
      font-weight:700;
    }
    a:hover{background:var(--red)}
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscas no existe o cambió de ubicación.</p>
    <a href="/">Volver a ColitasHub</a>
  </main>
</body>
</html>
